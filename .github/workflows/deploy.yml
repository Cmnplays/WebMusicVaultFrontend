name: Frontend CI
#since i am using render as backend i can't do the cd steps here
#the cd steps are handled in vercel itself.
on:
  push:
    branches:
      - v3
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install Dependencies
        run: npm install
      - name: Build Typescript
        run: npm run build
      # - name: Verify docker compose build and run
      #   run: docker compose up -d

      # - name: Stop and remove docker containers
      #   run: docker compose down
